plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pikminbot.tools'
    compileSdk 36

    defaultConfig {
        applicationId "com.pikminbot.tools"
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName "3.5"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // The local-ADB tier execs a bundled `adb` binary from the APK's native
    // library dir, so the libs must be extracted to disk (not kept inside the
    // APK as a mapped, non-executable blob).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // This app's entire purpose is mock-location injection; the MockLocation
    // lint gate would otherwise block release builds.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
